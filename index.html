<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kharcha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='17' fill='%230b7a5c'/%3E%3Crect x='12' y='15' width='40' height='38' rx='9' fill='white'/%3E%3Crect x='20.3' y='9.2' width='3.4' height='11.5' rx='1.7' fill='white' stroke='%230b7a5c' stroke-width='2.5'/%3E%3Crect x='40.3' y='9.2' width='3.4' height='11.5' rx='1.7' fill='white' stroke='%230b7a5c' stroke-width='2.5'/%3E%3Cg fill='none' stroke='%230b7a5c' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 28H41M24 35H41'/%3E%3Cpath d='M26 28C35 28 38 31 38 35C38 39 34 42 26 42L38 52'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9f3ee; --surface:#ffffff; --ink:#14213d; --muted:#5d6b82; --line:#cfe0d7;
  --accent:#0b7a5c; --accent-ink:#ffffff; --over:#d6336c; --good:#12805c;
  --warn:#b45f00; --over-ink:#ffffff; --c-housing:#2b4eff; --c-food:#f08c00; --c-transport:#0ca678; --c-bills:#7048e8;
  --c-health:#e03131; --c-fun:#d6336c; --c-shopping:#1098ad; --c-other:#868e96;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a16; --surface:#142720; --ink:#e8edf7; --muted:#97a3bb; --line:#24423a;
    --accent:#3ddc97; --accent-ink:#08201a; --over:#ff6b9a; --good:#3ddc97; --warn:#ffc247; --over-ink:#2a0a16;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a16; --surface:#142720; --ink:#e8edf7; --muted:#97a3bb; --line:#24423a;
  --accent:#3ddc97; --accent-ink:#08201a; --over:#ff6b9a; --good:#3ddc97; --warn:#ffc247; --over-ink:#2a0a16;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* profile bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:50px;height:50px;flex:none;filter:drop-shadow(0 4px 8px rgba(20,33,61,.22))}
.bt{min-width:0}
.bt .name{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.top .hi{font-size:.9rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.15rem;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.1rem}
.hint{color:var(--muted);font-size:.82rem;margin-top:5px}
/* warning banner */
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--warn);border-radius:14px;padding:11px 13px;margin:0 0 14px;font-size:.95rem}
.warn.over{border-color:var(--over)}
.warn b{display:block;color:var(--warn)}
.warn.over b{color:var(--over)}
.warn .ic{font-size:1.25rem;line-height:1.2}
/* calendar */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;text-align:center;font-size:.76rem;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{position:relative;aspect-ratio:1/1.05;border:1px solid transparent;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;min-width:0}
.cd.blank{background:none;border:0;pointer-events:none}
.cd .dn{font-size:.88rem;font-weight:600}
.cd .da{font-size:.66rem;color:var(--ink);min-height:1em;max-width:100%;overflow:hidden}
.cd.today{border-color:var(--ink)}
.cd.after{border-color:var(--over)}
.cd.after .da{color:var(--over);font-weight:700}
.cd.crossed{background:var(--over);border-color:var(--over);box-shadow:0 0 0 3px color-mix(in srgb, var(--over) 30%, transparent)}
.cd.crossed .dn,.cd.crossed .da{color:var(--over-ink)}
.cd[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.cd .cross{position:absolute;top:-6px;right:-4px;background:var(--surface);color:var(--over);border:2px solid var(--over);border-radius:999px;width:17px;height:17px;font-size:.7rem;font-weight:800;display:grid;place-items:center}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.legend{font-size:.8rem;color:var(--muted);margin-top:10px}
/* month nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.nav h1{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:.01em}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.2rem}
.icon-btn:active{transform:scale(.95)}

/* hero */
.hero{padding:6px 2px 18px}
.hero .label{color:var(--muted);font-size:.95rem}
.hero .big{font-size:clamp(3rem,16vw,4.6rem);font-weight:800;line-height:1;letter-spacing:-.03em;margin:4px 0 12px}
.hero .big.over{color:var(--over)}
.meter{height:14px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.meter span{display:block;height:100%;transition:width .35s ease}
.hero .sub{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:.92rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2{font-size:1rem;margin:0 0 12px;font-weight:600}

/* daily strip */
.days{display:flex;align-items:flex-end;gap:3px;height:96px;position:relative}
.day{flex:1;display:flex;align-items:flex-end;height:100%;position:relative}
.day i{display:block;width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--accent);opacity:.85}
.day.zero i{background:var(--line);opacity:1}
.day.today i{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.day.future i{opacity:.25}
.axis{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:6px}
.pace{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.7;pointer-events:none}

/* categories */
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:4px}
.cat .nm{font-size:.97rem}
.cat .pc{color:var(--muted);font-size:.85rem;margin-left:6px}

/* list */
.group{margin-top:6px}
.group h3{font-size:.85rem;color:var(--muted);font-weight:600;margin:16px 0 4px;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{font-weight:600;display:block}
.row .t small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600}
.del{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:50%;font-size:1.1rem}
.del:hover{background:var(--bg);color:var(--over)}
.empty{text-align:center;padding:26px 8px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:15px 26px;font-weight:700;font-size:1.02rem;box-shadow:0 6px 20px rgba(20,33,61,.28)}
.fab:active{transform:translateX(-50%) scale(.97)}

/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,30,.55)}
.sheet{padding:20px}
.sheet h2{margin:0 0 14px;font-size:1.15rem}
label{display:block;font-size:.88rem;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px}
input.amount{font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:.92rem;display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.err{color:var(--over);font-size:.88rem;min-height:1.2em;margin-top:8px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;font-size:.88rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.bad{background:var(--over);color:#fff;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.toast.caution{background:var(--warn);color:#1b1200;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* ---------- dynamic look ---------- */
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
.logo{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.avatar{box-shadow:0 0 0 3px var(--bg),0 0 0 5px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .2s}
.avatar:active{transform:scale(.92)}
.herocard{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 38%,transparent)}
.herocard.over{background:linear-gradient(135deg,var(--over),color-mix(in srgb,var(--over) 62%,#000));color:var(--over-ink);box-shadow:0 14px 34px color-mix(in srgb,var(--over) 38%,transparent)}
.herocard::before,.herocard::after{content:"";position:absolute;border-radius:50%;background:currentColor;opacity:.09;pointer-events:none}
.herocard::before{width:190px;height:190px;right:-60px;top:-70px;animation:drift 9s ease-in-out infinite}
.herocard::after{width:120px;height:120px;left:-40px;bottom:-60px;animation:drift 11s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,10px)}}
.herocard>*{position:relative;z-index:1}
.hero .herocard .label{color:inherit;opacity:.85}
.hero .herocard .big,.hero .herocard .big.over{color:inherit}
.hero .herocard .sub{color:inherit;opacity:.9}
.herocard .linkbtn{color:inherit}
.herocard .meter{background:color-mix(in srgb,currentColor 24%,transparent)}
.herocard .meter span{margin-right:2px;border-radius:2px}
.card{transition:transform .25s,box-shadow .25s}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,33,61,.10)}.cd:hover{transform:translateY(-2px)}}
.cd{transition:transform .15s,background .25s}
.cd:active{transform:scale(.92)}
.cd.crossed{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--over) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.fab{transition:transform .15s,box-shadow .25s;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 20px rgba(20,33,61,.28),0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 6px 20px rgba(20,33,61,.28),0 0 0 10px transparent}}
.chip{transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.94)}
dialog[open]{animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.1)}
dialog[open]::backdrop{animation:fade .25s}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{transform:translate(-50%,14px);transition:opacity .25s,transform .25s}
.toast.show{transform:translate(-50%,0)}
.row{animation:fade .3s both}
/* entrance (replayed by JS when .fx is set) */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.fx .top,.fx .nav,.fx .hero,.fx .wrap>.card,.fx .foot{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.fx .nav{animation-delay:.05s}.fx .hero{animation-delay:.1s}.fx #calCard{animation-delay:.18s}.fx #dailyCard{animation-delay:.26s}.fx #catCard{animation-delay:.34s}
.fx .meter span{transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) .3s both}
.fx .day i{transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*14ms + .3s)}
.fx .cd:not(.blank){animation:pop .35s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--i,0)*12ms + .2s)}
.fx .cd.crossed{animation:pop .35s both,pulse 1.8s ease-out 1s infinite;animation-delay:calc(var(--i,0)*12ms + .2s),1s}
.fx .cat{animation:slide .4s ease both;animation-delay:calc(var(--i,0)*70ms + .4s)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Kharcha logo" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="60" height="60" rx="17" fill="#0b7a5c"/>
        <rect x="12" y="15" width="40" height="38" rx="9" fill="#fff"/>
        <rect x="20.3" y="9.2" width="3.4" height="11.5" rx="1.7" fill="#fff" stroke="#0b7a5c" stroke-width="2.5"/>
        <rect x="40.3" y="9.2" width="3.4" height="11.5" rx="1.7" fill="#fff" stroke="#0b7a5c" stroke-width="2.5"/>
        <g fill="none" stroke="#0b7a5c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 28H41M24 35H41"/>
          <path d="M26 28C35 28 38 31 38 35C38 39 34 42 26 42L38 52"/>
        </g>
      </svg>
      <div class="bt"><div class="name">Kharcha</div><div class="hi" id="hi"></div></div>
    </div>
    <button class="avatar" id="avatarBtn" aria-label="Open profile"></button>
  </div>
  <div class="nav">
    <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
    <h1 id="monthLabel"></h1>
    <button class="icon-btn" id="next" aria-label="Next month">›</button>
  </div>

  <section class="hero" id="hero"></section>

  <section class="card" id="calCard">
    <h2>Calendar</h2>
    <div class="calhead" id="calhead"></div>
    <div class="cal" id="cal"></div>
    <div class="legend" id="calLegend"></div>
  </section>

  <section class="card" id="dailyCard">
    <h2>Spending by day</h2>
    <div class="days" id="days"></div>
    <div class="axis" id="axis"></div>
  </section>

  <section class="card" id="catCard">
    <h2>Where it went</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section class="card">
    <div class="listhead"><h2 id="listTitle">Expenses</h2><button class="linkbtn" id="clearDay" hidden>Show all days</button></div>
    <div id="list"></div>
  </section>

  <div class="foot">
    <button class="linkbtn" id="exportBtn">Export month as CSV</button>
  </div>
  <div class="foot">
    <button class="linkbtn" id="backupBtn">Backup all data</button>
    <button class="linkbtn" id="restoreBtn">Restore backup</button>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </div>
  <div class="hint" id="syncStatus" style="text-align:center;margin-top:14px"></div>
</div>

<button class="fab" id="addBtn">Add expense</button>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg">
  <div class="sheet" id="sheet"></div>
</dialog>

<script>
(function(){
  var CATS=[
    {id:'housing',name:'Housing',color:'var(--c-housing)'},
    {id:'food',name:'Food',color:'var(--c-food)'},
    {id:'transport',name:'Transport',color:'var(--c-transport)'},
    {id:'bills',name:'Bills',color:'var(--c-bills)'},
    {id:'health',name:'Health',color:'var(--c-health)'},
    {id:'fun',name:'Fun',color:'var(--c-fun)'},
    {id:'shopping',name:'Shopping',color:'var(--c-shopping)'},
    {id:'other',name:'Other',color:'var(--c-other)'}
  ];
  var LS_KEY='monthly-expenses-v1';

  var state={expenses:[],deleted:[],budgets:{},currency:'INR',currencySet:false,profile:{name:'',defaultBudget:0},theme:{mode:'system',accent:'emerald'},updatedAt:0};
  var view=new Date(); view.setDate(1);
  var dbDoc=null, saveTimer=null, selectedDay=null;

  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function money(n,compact){
    try{return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:(n%1===0||compact)?0:2}).format(n)}
    catch(e){return '₹'+n.toFixed(2)}
  }
  function compact(n){
    if(n>=10000000)return (n/10000000).toFixed(1).replace('.0','')+'Cr';
    if(n>=100000)return (n/100000).toFixed(1).replace('.0','')+'L';
    if(n>=1000)return (n/1000).toFixed(1).replace('.0','')+'k';
    return String(Math.round(n));
  }
  function catOf(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[CATS.length-1]}

  /* ---------- theme ---------- */
  var PALETTES={
    emerald:{name:'Emerald',dot:'#0b7a5c',
      light:{bg:'#e9f3ee',surface:'#ffffff',line:'#cfe0d7',accent:'#0b7a5c',ink:'#ffffff'},
      dark:{bg:'#0c1a16',surface:'#142720',line:'#24423a',accent:'#3ddc97',ink:'#08201a'}},
    indigo:{name:'Indigo',dot:'#2b4eff',
      light:{bg:'#eef2f0',surface:'#ffffff',line:'#d9e0dd',accent:'#2b4eff',ink:'#ffffff'},
      dark:{bg:'#0f1624',surface:'#18223a',line:'#2a3550',accent:'#6b86ff',ink:'#0f1624'}},

  function idb(fn){return new Promise(function(res){try{var r=indexedDB.open('kharcha',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onerror=function(){res(null)};r.onsuccess=function(){try{fn(r.result,res)}catch(e){res(null)}}}catch(e){res(null)}})}

  async function connectDb(){

      var db=await window.claude.use('db');

      if(!db||!user||!user.id){status.db='none';showStatus();return}
      var id=await user.id();
      if(!id){status.db='none';showStatus();return}
      var doc=db.collection('data/users/'+id).doc('tracker');
      var snap=await doc.get();

      if(remote){state=mergeStates(state,remote);writeLocal();applyTheme();render()}

  function countUp(el,to){
    if(!el)return;
    var from=prevBig==null?0:prevBig;prevBig=to;
    if(reduce||from===to){el.textContent=money(to);return}
    var t0=null,dur=700;
    function step(t){
      if(t0===null)t0=t;
      var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);

    requestAnimationFrame(step);
  }

    $('pSave').onclick=function(){
      var b=parseFloat($('pBudget').value);
      if($('pBudget').value!==''&&(isNaN(b)||b<0)){$('pErr').textContent='Enter a budget of 0 or more.';return}
      state.profile={name:$('pName').value.trim(),defaultBudget:isNaN(b)?0:b};
      save();render();$('dlg').close();toast('Profile saved');
    };
    $('dlg').showModal();
    setTimeout(function(){$('pName').focus()},50);
  }

  async function exportCsv(){
    var list=monthExpenses().slice().sort(function(a,b){return a.date<b.date?-1:1});
    if(!list.length){toast('Nothing to export this month');return}
    var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
    var csv='Date,Category,Note,Amount (INR)\n'+list.map(function(e){
      return [e.date,catOf(e.category).name,q(e.note||''),e.amount.toFixed(2)].join(',');
    }).join('\n');
    var filename='expenses-'+ym(view)+'.csv';
    try{
      var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
      if(dl){await dl.save({filename:filename,data:csv});toast('CSV saved');return}
    }catch(e){if(e&&e.code==='declined')return}
    try{
      await navigator.clipboard.writeText(csv);toast('CSV copied to clipboard');
    }catch(e){toast('Export is not available here')}
  }

  async function saveText(filename,data,okMsg){
    try{
      var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
      if(dl){await dl.save({filename:filename,data:data});toast(okMsg);return}
    }catch(e){if(e&&e.code==='declined')return}
    try{await navigator.clipboard.writeText(data);toast('Copied to clipboard')}catch(e){toast('Backup is not available here')}
  }
  function backup(){saveText('kharcha-backup-'+todayStr()+'.json',JSON.stringify(state),'Backup saved')}
  function restore(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var p=normalize(JSON.parse(r.result));
        state=mergeStates(state,p);save();applyTheme();render();toast('Backup restored');
      }catch(e){toast('Not a valid backup file','bad')}
    };
    r.readAsText(file);
  }

  /* ---------- wiring ---------- */
  $('backupBtn').onclick=backup;
  $('restoreBtn').onclick=function(){$('restoreFile').click()};
  $('restoreFile').onchange=function(){if(this.files[0])restore(this.files[0]);this.value=''};
  $('clearDay').onclick=function(){selectedDay=null;render()};
  $('prev').onclick=function(){play();selectedDay=null;view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
  $('next').onclick=function(){play();selectedDay=null;view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
  $('addBtn').onclick=openAdd;
  $('avatarBtn').onclick=openProfile;
  $('exportBtn').onclick=exportCsv;
  $('dlg').addEventListener('click',function(ev){if(ev.target===$('dlg'))$('dlg').close()});

  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  var local=loadLocal();
  if(local)state=normalize(local);
  applyTheme();
  play();
  render();
  showStatus();
  idbGet().then(function(v){
    if(v){
      var m=mergeStates(state,normalize(v));
      if(JSON.stringify(m)!==JSON.stringify(state)){state=m;applyTheme();render()}
    }
    if(local||v)writeLocal();
    connectDb();
  });
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
